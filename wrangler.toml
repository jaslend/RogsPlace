name = "rogsplace-api"
main = "worker/src/index.ts"
compatibility_date = "2026-08-19"

# The Worker is reachable only through the zone, never through workers.dev.
#
# Cloudflare Access protects the admin routes at the edge, and an edge policy
# that can be side-stepped by calling <name>.<subdomain>.workers.dev directly is
# not a policy at all. The Worker verifies the Access token itself as well, but
# closing this door removes the question.
workers_dev = false

# Origins allowed to make credentialed requests. In production the site and the
# API share an origin and this matters far less, but local development and the
# GitHub Pages test site are cross-origin.
#
# Never widen this to "*": that is incompatible with credentialed requests and
# would let any page on the internet call the API as a signed-in contributor.
[vars]
ALLOWED_ORIGINS = "https://rogsplace.co.uk,http://localhost:5173,http://localhost:4173,https://jaslend.github.io"

# Cloudflare Access, which authenticates the administrator.
#
# Neither value is a secret: the team domain appears in every sign-in URL, and
# the audience tag identifies an application rather than authorising anything.
# Both come from the Access application's overview page in the Zero Trust
# dashboard.
#
# While they are unset, no administrator exists at all -- the Worker fails
# closed rather than trusting the header Access would have set.
#
# ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# ACCESS_AUD = "the-application-audience-tag"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "rogsplace"
preview_bucket_name = "rogsplace-preview"

# Routing for production. The API lives on the same origin as the site so that
# session cookies are first-party: they are SameSite=Lax, and a browser will not
# send them from a site on one domain to an API on another.
#
# zone_name must match the zone in the Cloudflare account exactly, or the deploy
# is rejected.
[[routes]]
pattern = "rogsplace.co.uk/api/*"
zone_name = "rogsplace.co.uk"
