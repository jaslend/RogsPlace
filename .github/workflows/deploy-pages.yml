name: Deploy to GitHub Pages

# GitHub Pages hosts the development/test site. Production will move to
# Cloudflare Pages; nothing in the application needs to change when it does,
# because the base path is supplied here rather than hard-coded.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only by default; the deploy job asks for what it needs and nothing more.
permissions:
  contents: read

# Let a running deployment finish rather than cancelling it part-way.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        # A project site is served from https://<user>.github.io/<repository>/,
        # so the repository name becomes the base path. Taking it from the event
        # keeps this correct if the repository is ever renamed.
        #
        # The memorial's real details come from repository *variables*
        # (Settings -> Secrets and variables -> Actions -> Variables), not from
        # the repository itself, so a clone or a fork only ever gets the
        # placeholder content in src/data/site.json. Anything left unset falls
        # back to that placeholder.
        #
        # These are content, not secrets: they are compiled into the bundle and
        # displayed on the page. Never use secrets here.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SITE_TITLE: ${{ vars.SITE_TITLE }}
          VITE_SITE_NAME: ${{ vars.SITE_NAME }}
          VITE_SITE_DATE_OF_BIRTH: ${{ vars.SITE_DATE_OF_BIRTH }}
          VITE_SITE_DATE_OF_DEATH: ${{ vars.SITE_DATE_OF_DEATH }}
          VITE_SITE_WELCOME_TEXT: ${{ vars.SITE_WELCOME_TEXT }}
          VITE_SITE_MAIN_PHOTO: ${{ vars.SITE_MAIN_PHOTO }}
        run: npm run build

      - name: Upload the built site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
